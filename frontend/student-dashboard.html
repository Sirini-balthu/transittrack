<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/config.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard | TransitTrack</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div id="header"></div>
<main>
  <h1 id="hello">Welcome</h1>
  <p class="sub">Find your bus, check live status and request a seat.</p>
  <section class="stats" id="stats"></section>
  <div class="tabs" role="tablist">
    <button class="on" data-tab="routes" role="tab">Routes</button>
    <button data-tab="my" role="tab">My registrations</button>
    <button data-tab="buses" role="tab">Buses</button>
  </div>

  <section id="routes">
    <label for="q" style="margin-top:0">Search by stop</label>
    <input id="q" type="search" placeholder="Type a stop, e.g. Nagole" autocomplete="off">
    <div id="routeList" style="margin-top:16px"></div>
  </section>
  <section id="my" hidden><div id="myList"></div></section>
  <section id="buses" hidden><div id="busList"></div></section>
</main>
<script src="js/common.js"></script>
<script>
let user, routes=[], mine=[];

const seatsText=r=>r.bus?r.bus.capacity+' seats':'';
function routeCard(r,q){
  const stops=stopsOf(r), b=r.bus||{}, ql=q.toLowerCase();
  const reg=mine.find(g=>g.routeId===r.routeId&&g.status!=='REJECTED');
  const action=reg?statusBadge(reg.status)+' <span class="mut">'+esc(reg.stopName)+'</span>'
    :'<button class="btn sm" data-reg="'+r.routeId+'">Register for this route</button>';
  return '<article class="card"><div class="row"><h2 style="margin:0">'+esc(r.routeName)+'</h2>'+statusBadge(r.status)+'</div>'
   +'<div class="mut">'+esc(r.startPoint)+' → '+esc(r.endPoint)+' · '+t12(r.startTime)+' – '+t12(r.endTime)+'</div>'
   +'<div class="chips">'+stops.map(s=>'<span class="chip '+(q&&s.toLowerCase().includes(ql)?'hit':'')+'">'+esc(s)+'</span>').join('')+'</div>'
   +'<div class="row"><span class="mut">Bus '+esc(b.busNumber||'—')+' · Driver '+esc(b.driverName||'—')+' ('+esc(b.driverContact||'—')+') · '+seatsText(r)+'</span><span>'+action+'</span></div></article>';
}
function showRoutes(q=''){
  $('#routeList').innerHTML=routes.length?routes.map(r=>routeCard(r,q)).join(''):
   '<div class="card empty">'+(q?'No route passes “'+esc(q)+'”. Check the spelling or clear the search.':'No routes have been added yet.')+'</div>';
}
async function loadRoutes(q=''){
  $('#routeList').innerHTML=skeleton(3);
  try{routes=await api('/routes'+(q?'?stop='+encodeURIComponent(q):''));showRoutes(q);}
  catch(e){$('#routeList').innerHTML='<div class="card empty">'+esc(e.message)+'</div>';}
}
function showMine(){
  $('#myList').innerHTML=mine.length?'<div class="card tw"><table><thead><tr><th>Route</th><th>Bus</th><th>Boarding stop</th><th>Requested</th><th>Status</th><th></th></tr></thead><tbody>'
   +mine.slice().reverse().map(g=>'<tr><td>'+esc(g.routeName)+'</td><td>'+esc(g.busNumber)+'</td><td>'+esc(g.stopName)+'</td><td>'+new Date(g.requestedAt).toLocaleDateString()+'</td><td>'+statusBadge(g.status)+'</td><td>'+(g.status==='PENDING'?'<button class="btn sec sm" data-cancel="'+g.registrationId+'">Cancel request</button>':'')+'</td></tr>').join('')+'</tbody></table></div>'
   :'<div class="card empty">You have not requested a route yet.<br><br><button class="btn" data-tab="routes">Browse routes</button></div>';
}
async function loadMine(){
  mine=await api('/registrations/my');showMine();
  const ap=mine.filter(g=>g.status==='APPROVED').length, pe=mine.filter(g=>g.status==='PENDING').length;
  $('#stats').innerHTML=[[routes.length||'—','Routes'],[routes.filter(r=>r.status==='DELAYED').length,'Delayed now'],[pe,'Pending requests'],[ap,'Approved routes']].map(s=>'<div class="card stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>').join('');
}
async function loadBuses(){
  $('#busList').innerHTML=skeleton(2);
  try{const bs=await api('/buses');
   $('#busList').innerHTML=bs.length?'<div class="card tw"><table><thead><tr><th>Bus</th><th>Capacity</th><th>Driver</th><th>Contact</th><th>Status</th></tr></thead><tbody>'+bs.map(b=>'<tr><td>'+esc(b.busNumber)+'</td><td>'+b.capacity+'</td><td>'+esc(b.driverName)+'</td><td>'+esc(b.driverContact)+'</td><td>'+statusBadge(b.status)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="card empty">No buses yet.</div>';
  }catch(e){$('#busList').innerHTML='<div class="card empty">'+esc(e.message)+'</div>';}
}
function openReg(id){
  const r=routes.find(x=>x.routeId===id), q=$('#q').value.trim().toLowerCase(), st=stopsOf(r);
  const hit=st.find(s=>q&&s.toLowerCase().includes(q))||st[0];
  const o=openModal('Register for '+r.routeName,'<label for="stop">Your boarding stop</label><select id="stop">'+st.map(s=>'<option '+(s===hit?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select><p class="mut">An admin must approve your request before you are added as a passenger.</p><div class="err" id="er"></div><div class="acts"><button class="btn sec" id="x">Cancel</button><button class="btn" id="ok">Send request</button></div>');
  o.querySelector('#x').onclick=closeModal;
  o.querySelector('#ok').onclick=async e=>{
    e.target.disabled=true;
    try{await api('/registrations',{method:'POST',body:{routeId:id,stopName:o.querySelector('#stop').value}});
      closeModal();toast('Request sent for approval','ok');await loadMine();showRoutes($('#q').value.trim());}
    catch(err){o.querySelector('#er').textContent=err.message;e.target.disabled=false;}
  };
}
function switchTab(t){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  ['routes','my','buses'].forEach(s=>$('#'+s).hidden=s!==t);
  if(t==='buses')loadBuses();
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab]');if(t)return switchTab(t.dataset.tab);
  const r=e.target.closest('[data-reg]');if(r)return openReg(+r.dataset.reg);
  const c=e.target.closest('[data-cancel]');
  if(c&&await confirmBox('Cancel this registration request?','Cancel request',true)){
    try{await api('/registrations/'+c.dataset.cancel,{method:'DELETE'});toast('Request cancelled','ok');await loadMine();showRoutes($('#q').value.trim());}
    catch(err){toast(err.message,'bad');}
  }
});
$('#q').addEventListener('input',debounce(()=>loadRoutes($('#q').value.trim())));
(async()=>{
  user=await requireUser('STUDENT','student-dashboard.html');if(!user)return;
  $('#hello').textContent='Welcome, '+user.name;
  await loadRoutes();
  try{await loadMine();showRoutes();}catch(e){toast(e.message,'bad');}
  setInterval(async()=>{if(!$('#q').value&&!$('#modal'))await loadRoutes();},30000); // live status refresh
})();
</script>
</body>
</html>
