spring.application.name=transittrack

# Embedded database (H2) - no installation or SQL needed.
# Data is saved in the backend/data folder, so it survives restarts.
spring.datasource.url=jdbc:h2:file:./data/transittrack
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate (tables are created automatically)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server
server.port=${PORT:8080}
server.forward-headers-strategy=framework
logging.level.org.springframework.security=WARN

# Default admin account (created automatically on first start)
transittrack.admin.email=${ADMIN_EMAIL:admin@transittrack.com}
transittrack.admin.password=${ADMIN_PASSWORD:Admin@12345}

# Frontend origins allowed to call this API (comma separated)
transittrack.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
